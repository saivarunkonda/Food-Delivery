version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fooddelivery-postgres
    environment:
      POSTGRES_DB: fooddelivery
      POSTGRES_USER: fooddelivery
      POSTGRES_PASSWORD: fooddelivery123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - fooddelivery-network

  redis:
    image: redis:7-alpine
    container_name: fooddelivery-redis
    ports:
      - "6379:6379"
    networks:
      - fooddelivery-network

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: fooddelivery-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - fooddelivery-network

  backend:
    build: ./backend
    container_name: fooddelivery-backend
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: fooddelivery
      POSTGRES_USER: fooddelivery
      POSTGRES_PASSWORD: fooddelivery123
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: guest
      RABBITMQ_PASSWORD: guest
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - fooddelivery-network

  frontend:
    build: ./frontend
    container_name: fooddelivery-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - fooddelivery-network

volumes:
  postgres-data:

networks:
  fooddelivery-network:
    driver: bridge
